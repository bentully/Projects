<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omzig Development</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
    <link rel="stylesheet" href="app.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid nav-contain justify-content-center">
        <div class="row">
          <div class="col-12 d-flex justify-content-center">
            <a href="#" class="navbar-brand me-0">
              <img src="media/fullLogo.png" id="logo" alt="Omzig Logo" />
            </a>
          </div>
          <div class="col-12 mt-3">
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav m-auto d-flex justify-content-center">
                <li class="nav-item px-5 m3">
                  <a
                    class="nav-link link-opacity-75 link-opacity-100-hover"
                    aria-current="page"
                    href="#">
                    Showcase
                  </a>
                </li>
                <li class="nav-item px-5 m3">
                  <a
                    class="nav-link link-opacity-75 link-opacity-100-hover"
                    aria-current="page"
                    href="#">
                    Consultation
                  </a>
                </li>
                <li class="nav-item px-5 m3">
                  <a
                    class="nav-link link-opacity-75 link-opacity-100-hover"
                    aria-current="page"
                    href="#">
                    Feedback
                  </a>
                </li>
                <li class="nav-item px-5 m3">
                  <a
                    class="nav-link link-opacity-75 link-opacity-100-hover"
                    aria-current="page"
                    href="#">
                    Contact
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <main class="container-fluid"></main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </body>
</html>
