<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omzig Development</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
    <link rel="stylesheet" href="app.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid nav-contain justify-content-center">
        <div class="row w-100">
          <div class="col-6 d-flex justify-content-start ps-3">
            <a href="#" class="navbar-brand">
              <img src="media/fullLogo.png" id="logo" alt="Omzig Logo" />
            </a>
          </div>
          <div class="col-6 d-flex justify-content-end pe-3">
            <button
              class="navbar-toggler border-0"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav d-flex align-items-end justify-content-end">
                <li class="nav-item">
                  <a
                    class="nav-link link-opacity-75 link-opacity-100-hover"
                    aria-current="page"
                    href="#">
                    Services
                  </a>
                </li>
                <li class="nav-item">
                  <a
                    class="nav-link link-opacity-75 link-opacity-100-hover"
                    aria-current="page"
                    href="#">
                    About
                  </a>
                </li>
                <li class="nav-item">
                  <a
                    class="nav-link link-opacity-75 link-opacity-100-hover"
                    aria-current="page"
                    href="#">
                    Pricing
                  </a>
                </li>
                <li class="nav-item">
                  <a
                    class="nav-link link-opacity-75 link-opacity-100-hover"
                    aria-current="page"
                    href="#">
                    Contact
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </nav>
    <span
      class="display-2 position-relative z-n1 bg-hero d-flex justify-content-center m-1">
      Development
    </span>
    <main class="container-fluid p-0">
      <article>
        <video
          class="w-100 bg-vid position-absolute z-n1"
          src="media/bgVid.mp4"
          autoplay
          muted
          loop></video>
        <div
          class="bg-cover z-n1 border border-dark d-flex align-items-center justify-content-center">
          <section
            class="hero border border-white border-3 d-flex flex-column align-items-center justify-content-evenly rounded-4 p-4">
            <p class="text-center display-6">Elevate your brand!</p>
            <h1 class="text-center display-3">
              Crafting high-performance websites for fast-growing businesses
              nationwide
            </h1>
            <p class="text-center display-6">
              We turn local searches into loyal customers with lightning-fast
              websites.
            </p>
            <a
              href="https://calendly.com/tullyben222/30min"
              class="btn btn-dark btn-lg">
              Let's Scale your Business
            </a>
          </section>
        </div>
      </article>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </body>
</html>
